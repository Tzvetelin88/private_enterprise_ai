replicaCount: 1

image:
  repository: agentic-rag
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002

config:
  databaseUrl: "postgresql://postgres:changeme-postgres-admin@postgres:5432/private_ai"
  hybridRagUrl: "http://hybrid-rag:8001"
  llmUrl: "http://host.docker.internal:11434"
  llmModel: "qwen3.5:4b"
  maxIterations: 3
  # Dynamic MCP tool discovery/invocation for the retrieval step — see
  # mcp/ARCHITECTURE.md. Falls back to hybridRagUrl above if the hub is
  # unreachable, its catalog is empty, or the model returns no tool call.
  mcpHubUrl: "http://mcp-hub:8010"
  mcpToolCallingEnabled: true
  tracingBackend: "langfuse"  # "langfuse" | "langsmith" | "none"
  langfuseHost: "http://langfuse:3000"
  langfusePublicKey: ""
  langfuseSecretKey: ""
  debug: false

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"
