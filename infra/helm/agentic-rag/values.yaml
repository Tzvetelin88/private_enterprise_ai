replicaCount: 1

image:
  repository: agentic-rag
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002

config:
  databaseUrl: "postgresql://postgres:changeme-postgres-admin@postgres:5432/private_ai"
  hybridRagUrl: "http://hybrid-rag:8001"
  llmUrl: "http://host.docker.internal:11434"
  llmModel: "llama3.2:3b"
  maxIterations: 3
  tracingBackend: "langfuse"  # "langfuse" | "langsmith" | "none"
  langfuseHost: "http://langfuse:3000"
  langfusePublicKey: ""
  langfuseSecretKey: ""
  debug: false

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"
