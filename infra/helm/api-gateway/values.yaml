image:
  repository: api-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 8080
  nodePort: 30880

config:
  vllmUrl: "http://host.docker.internal:11434"  # Ollama (Mac) — change to http://vllm:8000 for NVIDIA in-cluster
  # vllmUrl: "http://host.docker.internal:8000"  # vLLM external (NVIDIA/WSL2)
  infinityUrl: "http://infinity-embeddings:7997"  # ClusterIP — same for all platforms
  debug: false

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 250m
