apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-server.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: mcp-server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: HYBRID_RAG_URL
          value: {{ .Values.config.hybridRagUrl | quote }}
        - name: AGENTIC_RAG_URL
          value: {{ .Values.config.agenticRagUrl | quote }}
        - name: GRAPH_RAG_URL
          value: {{ .Values.config.graphRagUrl | quote }}
        - name: LLM_URL
          value: {{ .Values.config.llmUrl | quote }}
        - name: LLM_MODEL
          value: {{ .Values.config.llmModel | quote }}
        - name: INFINITY_EMBEDDINGS_URL
          value: {{ .Values.config.infinityEmbeddingsUrl | quote }}
        - name: EMBEDDING_MODEL
          value: {{ .Values.config.embeddingModel | quote }}
        - name: MCP_HUB_URL
          value: {{ .Values.config.mcpHubUrl | quote }}
        - name: DEBUG
          value: {{ .Values.config.debug | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
