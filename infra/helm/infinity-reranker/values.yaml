replicaCount: 1

image:
  repository: michaelf34/infinity
  tag: "0.0.61"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7998

config:
  model: "BAAI/bge-reranker-v2-m3"
  port: 7998

persistence:
  enabled: true
  storageClass: "standard"
  size: 5Gi
  mountPath: /app/.cache

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

# Increase if model download times out on slow connections
startupProbeFailureThreshold: 60
