apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: default
type: Opaque
stringData:
  # Bitnami PostgreSQL chart expects these specific keys:
  # - postgres-password: password for 'postgres' superuser
  # - password: password for the custom user (auth.username)
  # - replication-password: password for replication user
  postgres-password: "changeme-postgres-admin"
  password: "changeme-private-ai-user"
  replication-password: "changeme-replication"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: default
data:
  POSTGRES_DB: "private_ai"
  POSTGRES_USER: "private_ai"
