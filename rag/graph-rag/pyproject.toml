[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rag"
version = "0.1.0"
description = "Graph RAG Service — entity extraction, Neo4j knowledge graph, hybrid traversal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "neo4j>=5.19.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
