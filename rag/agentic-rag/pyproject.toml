[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic / Self-correcting RAG Service — LangGraph adaptive retrieval with Langfuse tracing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "asyncpg>=0.29.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langfuse>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
