[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid Search RAG Service — dense + BM25 retrieval with RRF fusion and cross-encoder reranking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "elasticsearch[async]>=8.13.0",
    "aiohttp>=3.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
