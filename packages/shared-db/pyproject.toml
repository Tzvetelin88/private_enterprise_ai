[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-db"
version = "0.1.0"
description = "Shared database utilities — asyncpg pool, pgvector helpers, Alembic migrations"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.25",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
